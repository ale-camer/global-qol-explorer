services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/adc.json
    volumes:
      - ./backend:/app:z
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro,z
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
