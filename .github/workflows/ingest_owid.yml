name: Weekly OWID Data Ingestion

on:
  schedule:
    # Runs every Monday at 08:00 UTC (05:00 AM ART)
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run OWID Ingestion & WhatsApp Notification
        env:
          PYTHONPATH: .
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_CALLMEBOT_APIKEY: ${{ secrets.WHATSAPP_CALLMEBOT_APIKEY }}
        run: |
          python -m backend.ingestion.ingest_owid

      - name: Commit & Push updated SQLite snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/qol.sqlite
          if git diff --cached --quiet; then
            echo "No changes in qol.sqlite since last run."
          else
            git commit -m "chore(data): weekly OWID snapshot refresh"
            git push
          fi

      - name: Fallback WhatsApp Alert on Workflow Infrastructure Failure
        if: failure()
        env:
          PYTHONPATH: .
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_CALLMEBOT_APIKEY: ${{ secrets.WHATSAPP_CALLMEBOT_APIKEY }}
        run: |
          python -c "
          from backend.ingestion.notify_whatsapp import build_whatsapp_message, send_whatsapp_notification
          msg = build_whatsapp_message(False, 0, 44, 240, 0, 0, 0.0, 'Fallo en el workflow de GitHub Actions (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})')
          send_whatsapp_notification(msg)
          "
